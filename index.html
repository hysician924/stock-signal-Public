
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signal Monitor v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .signal-buy {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }
        .signal-sell {
            background: linear-gradient(135deg, #e11d48 0%, #fb7185 100%);
            box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.3);
        }
        .signal-hold {
            background: linear-gradient(135deg, #475569 0%, #64748b 100%);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                    SIGNAL MONITOR PRO
                </h1>
                <p class="text-slate-400 text-sm mt-1">Real-time Technical Analysis Dashboard</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="symbolInput" value="TSLA" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-32 uppercase">
                <button onclick="updateData()" class="bg-blue-600 hover:bg-blue-500 transition px-6 py-2 rounded-lg font-bold">연동 시작</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Main Chart Card -->
            <div class="lg:col-span-2 glass-card rounded-3xl p-6 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="displaySymbol" class="text-xl font-bold">TSLA / USD</h2>
                    <div id="priceDisplay" class="text-2xl font-mono font-bold text-blue-400">Loading...</div>
                </div>
                <div id="chart" class="w-full h-[400px]"></div>
            </div>

            <!-- Signal & Logic Card -->
            <div class="flex flex-col gap-6">
                <!-- Final Decision Gradient Card -->
                <div id="signalCard" class="signal-hold rounded-3xl p-8 flex flex-col items-center justify-center text-center transition-all duration-500 h-48">
                    <span class="text-sm font-semibold opacity-80 mb-2 uppercase tracking-widest">Current Signal</span>
                    <h2 id="signalText" class="text-4xl font-black">HOLD</h2>
                    <p id="signalStrength" class="text-xs mt-2 opacity-70">조건 충족 대기 중...</p>
                </div>

                <!-- Detailed Checklist -->
                <div class="glass-card rounded-3xl p-6 flex-grow">
                    <h3 class="text-slate-400 text-xs font-bold uppercase mb-4 tracking-widest">Logic Verification (2/3 Rule)</h3>
                    <div id="checklist" class="space-y-3">
                        <!-- Buying Rules -->
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">RSI(14) ≤ 40</span>
                            <span id="rule-rsi-buy" class="text-slate-500">⚪</span>
                        </div>
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">주요 지지선 근접</span>
                            <span id="rule-price-buy" class="text-slate-500">⚪</span>
                        </div>
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">거래량 급감</span>
                            <span id="rule-vol-buy" class="text-slate-500">⚪</span>
                        </div>
                        <hr class="border-slate-700 my-2">
                        <!-- Selling Rules -->
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">RSI(14) ≥ 70</span>
                            <span id="rule-rsi-sell" class="text-slate-500">⚪</span>
                        </div>
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">볼린저 상단 터치</span>
                            <span id="rule-bb-sell" class="text-slate-500">⚪</span>
                        </div>
                        <div class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50 flex justify-between items-center">
                            <span class="text-sm">스토캐스틱 K ≥ 85</span>
                            <span id="rule-stoch-sell" class="text-slate-500">⚪</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-500 text-xs">
            API Key를 입력하지 않으면 샘플 데이터로 동작합니다. Github Pages 업로드 시 <code>index.html</code>로 저장하세요.
        </footer>
    </div>

    <script>
        let chart, candleSeries;
        
        // Initialize Chart
        function initChart() {
            const chartOptions = { 
                layout: { textColor: '#94a3b8', background: { type: 'solid', color: 'transparent' } },
                grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#334155' }
            };
            chart = LightweightCharts.createChart(document.getElementById('chart'), chartOptions);
            candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#f43f5e', borderVisible: false,
                wickUpColor: '#10b981', wickDownColor: '#f43f5e',
            });
            
            // Resize handler
            window.addEventListener('resize', () => {
                chart.applyOptions({ width: document.getElementById('chart').clientWidth });
            });
        }

        async function updateData() {
            const symbol = document.getElementById('symbolInput').value.toUpperCase();
            document.getElementById('displaySymbol').innerText = symbol + " / USD";
            
            // API 연동 예시 (Alpha Vantage 혹은 FinnHub API 사용 권장)
            // 실제 API 사용시: fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=D&token=YOUR_API_KEY`)
            // 여기서는 시연을 위해 가상 데이터를 생성합니다.
            
            const mockData = generateMockData();
            candleSeries.setData(mockData);
            
            const lastCandle = mockData[mockData.length - 1];
            document.getElementById('priceDisplay').innerText = `$${lastCandle.close.toFixed(2)}`;
            
            // 로직 계산
            analyzeSignals(mockData);
        }

        function generateMockData() {
            const data = [];
            let price = 400;
            const now = new Date();
            for (let i = 100; i > 0; i--) {
                const open = price + (Math.random() - 0.5) * 10;
                const close = open + (Math.random() - 0.5) * 10;
                const high = Math.max(open, close) + Math.random() * 5;
                const low = Math.min(open, close) - Math.random() * 5;
                const time = new Date(now.getTime() - i * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                data.push({ time, open, high, low, close, volume: Math.random() * 1000000 });
                price = close;
            }
            return data;
        }

        function analyzeSignals(data) {
            const last = data[data.length - 1];
            const prev = data[data.length - 2];
            
            // 가상 지표 계산 (실제 서비스 시 라이브러리 사용 권장)
            const rsi = 38 + Math.random() * 5; // 예시값
            const stochK = 80 + Math.random() * 10; // 예시값
            const avgVol = data.slice(-20).reduce((a,b) => a + b.volume, 0) / 20;
            
            let buyCount = 0;
            let sellCount = 0;

            // 매수 로직 검증
            const rsiBuy = rsi <= 40; if(rsiBuy) buyCount++;
            const priceBuy = last.close <= 405; if(priceBuy) buyCount++;
            const volBuy = last.volume <= avgVol * 0.5; if(volBuy) buyCount++;

            // 매도 로직 검증
            const rsiSell = rsi >= 70; if(rsiSell) sellCount++;
            const bbSell = last.high >= last.close * 1.05; if(bbSell) sellCount++; // 간이 BB
            const stochSell = stochK >= 85; if(stochSell) sellCount++;

            // UI 업데이트
            updateChecklist('rule-rsi-buy', rsiBuy);
            updateChecklist('rule-price-buy', priceBuy);
            updateChecklist('rule-vol-buy', volBuy);
            updateChecklist('rule-rsi-sell', rsiSell);
            updateChecklist('rule-bb-sell', bbSell);
            updateChecklist('rule-stoch-sell', stochSell);

            const card = document.getElementById('signalCard');
            const text = document.getElementById('signalText');
            const strength = document.getElementById('signalStrength');

            if (buyCount >= 2) {
                card.className = "signal-buy rounded-3xl p-8 flex flex-col items-center justify-center text-center transition-all duration-500 h-48";
                text.innerText = "BUY SIGNAL";
                strength.innerText = `${buyCount}/3 조건 충족: 적극 매수 고려`;
            } else if (sellCount >= 2) {
                card.className = "signal-sell rounded-3xl p-8 flex flex-col items-center justify-center text-center transition-all duration-500 h-48";
                text.innerText = "SELL SIGNAL";
                strength.innerText = `${sellCount}/3 조건 충족: 수익 실현 권장`;
            } else {
                card.className = "signal-hold rounded-3xl p-8 flex flex-col items-center justify-center text-center transition-all duration-500 h-48";
                text.innerText = "HOLD / WAIT";
                strength.innerText = "신호 대기 중...";
            }
        }

        function updateChecklist(id, active) {
            const el = document.getElementById(id);
            el.innerText = active ? "✅" : "⚪";
            el.className = active ? "text-green-400 font-bold" : "text-slate-600";
        }

        initChart();
        updateData();
    </script>
</body>
</html>
